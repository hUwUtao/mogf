[package]
name = "mogf"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
rustybuzz = "0.20.1"
unicode-segmentation = "1.13.3"
ttf-parser = "0.25.1"
lyon_tessellation = "1.0.20"
naga = { version = "29.0.4", features = ["wgsl-in"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wgpu = "29.0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "wav"] }
gltf = { version = "1.4.1", features = ["KHR_materials_emissive_strength"] }
tobj = "4.0.5"
urlencoding = "2.1.3"
openusd = "0.8.0"
openusd-schemas = { version = "0.8.0", features = ["geom", "shade", "skel"] }
